name: kindoverse
description: "Kindoverse — Multi-Platform Impact Funding & Social Development Platform (Crowdfunding, CSR Sponsorship, & Individual Micro-Donations)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Firebase Backend & Geo-Queries
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  geoflutterfire_plus: ^0.0.32

  # File Picking, Maps & Formatting
  file_picker: ^9.2.1
  google_maps_flutter: ^2.10.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/kindoverse_logo.png
