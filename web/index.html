    #initial-logo-loader video,

      max-height: 440px;
      object-fit: contain;
      background-color: #FFFFFF;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      animation: dynamicLogoPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes dynamicLogoPop {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }

        opacity: 1;
        transform: scale(1.0);
      }
    }

<body>
  <div id="initial-logo-loader">
    <video
      id="initial-logo-video"
      src="kindo_logo.mp4?v=2"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      aria-label="Kindoverse — Kindness starts with you"
    ></video>
  </div>
  <script>
    (function () {
      var startTime = Date.now();
      var minDisplayMs = 2200;
      var video = document.getElementById('initial-logo-video');
      if (video && typeof video.play === 'function') {
        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function () {});
        }
      }
      function hideLoader() {
        var loader = document.getElementById('initial-logo-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transform = 'scale(1.04)';
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 460);
        }
      }
      window.addEventListener('flutter-first-frame', function () {
        var elapsed = Date.now() - startTime;
        var remaining = Math.max(0, minDisplayMs - elapsed);
        setTimeout(hideLoader, remaining);
      });
    })();
  </script>
